# ==============================================================================
# SEC-8: LeadGuard fail2ban jail configuration
# Place in /etc/fail2ban/jail.d/leadguard.conf
# ==============================================================================

[sshd]
enabled = true
port = ssh
filter = sshd
maxretry = 3
findtime = 600
bantime = 3600

[leadguard-login]
enabled = true
port = http,https
filter = leadguard-login
logpath = /var/log/leadguard/app.log
maxretry = 5
findtime = 60
bantime = 900
